<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Interactive Event Cards</title>
        <style>
            body {
              font-family: cursive;  
            }

            section{
              text-align: center;
              margin: 20px;
            }

            h2 {
                cursor: grab;
            }

            .card-btn {
                padding: 15px 30px;
                font-size: 18px;
                cursor: pointer;
                margin-top: 20px;
            }

            .container {
                margin-top: 20px;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
            }

            .card {
                display: inline-block;
                padding: 10px 20px;
                margin: 5px;
                background-color: #f0a500;
                border-radius: 5px;
                color: white;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <h1>Adding Event Listeners:- Mouse Events, Scroll Events, Touch Events, Pointer Events, Drag Events</h1>

        <section>
          <h2 draggable="true" >Drag Me!</h2>
          <button class="card-btn">Add Cards</button>
          <button class="dlt-btn">Delete Cards</button>
          <div class="container"></div>
        </section>

        <script>
            const h2 = document.querySelector("h2");
            const addCardButton = document.querySelector(".card-btn");
            const removeCardButton = document.querySelector(".dlt-btn");
            const container = document.querySelector(".container");

            let count = 1;

            // Function to create a new card
            function createCard(e) {
                const newCard = document.createElement("div");
                newCard.classList.add("card");
                newCard.innerText = `${count++} (${e.type})`;
                container.appendChild(newCard);
            }

            //Mouse Event
            addCardButton.addEventListener('click',createCard)
            addCardButton.addEventListener('dblclick',createCard)
            addCardButton.addEventListener('mouseover',createCard)
            // addCardButton.addEventListener('mouseover',createCard)
            addCardButton.addEventListener('mouseleave',createCard)

            //touch  event
            addCardButton.addEventListener('touchstart',createCard)
            addCardButton.addEventListener('touchend',createCard)

            //scroll Events
            document.addEventListener('scroll',createCard)

           //delete button
        //    removeCardButton.addEventListener("click",()=>{
        //     container.innerHTML=''
        //     count=1
        //    })
        
            

            //remove button
            removeCardButton.addEventListener('click',()=>{
            const clear=document.querySelector(".card")
            clear.remove()
            // clear.innerText=''
            count=1
        })
        </script>
    </body>
</html>
